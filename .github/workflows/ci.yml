name: Campus Commons CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: ./mvnw -B verify
      - run: docker compose up -d --wait
      - run: |
          java -jar target/commons-0.1.0.jar >target/app.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then exit 0; fi
            sleep 1
          done
          cat target/app.log
          exit 1
        env:
          LIVEKIT_API_URL: http://127.0.0.1:7880
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret
      - run: |
          npm run dev >/tmp/campus-ui.log 2>&1 &
          for attempt in {1..15}; do
            if curl -fsS http://localhost:5173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright install --with-deps chromium
          VOICE_E2E=1 npm run test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campus-logs
          path: |
            target/app.log
            target/surefire-reports/
            frontend/test-results/
